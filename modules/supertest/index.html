const SCHEMA='mpw-supertest/v1';
const CHOICES=new Set(['A','B','BOTH','NEITHER','UNSURE','SKIP']);
const VISUAL_COUNT=15;
const safeObject=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function createState(){return {schema:SCHEMA,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),answers:{},importance:{},maxdiff:{},situations:{},visuals:{},reflections:{},dealbreakers:[],snapshots:[],legacyImports:[],extensions:[],extensionAnswers:{}};}
function indexBank(bank,modules){
 if(bank?.questions?.length!==135||bank?.domains?.length!==12)throw Error('Expected original 135-question v2 bank and 12 domains');
 const questions=new Map(),domainSet=new Set(bank.domains.map(d=>d.code));
 for(const q of bank.questions){if(questions.has(q.id)||(!domainSet.has(q.domain)&&q.domain!=='TRADEOFF')||!q.prompt||!q.A||!q.B)throw Error('Malformed or duplicate bank question '+q.id);questions.set(q.id,q)}
 if(modules?.maxdiff?.length!==20||modules?.situations?.length!==12||modules?.reflections?.length!==50)throw Error('Missing extension modules');
 const cardIds=new Set();for(const card of modules.maxdiff){if(cardIds.has(card.id)||card.facets.length!==4||new Set(card.facets).size!==4)throw Error('Invalid MaxDiff cards');cardIds.add(card.id)}
 const facetCounts=new Map(modules.facets.map(f=>[f.id,0]));for(const c of modules.maxdiff)for(const id of c.facets){if(!facetCounts.has(id))throw Error('Unknown facet');facetCounts.set(id,facetCounts.get(id)+1)}
 if([...facetCounts.values()].some(n=>n!==5))throw Error('MaxDiff balance broken');
 return {questions,domainSet,facets:new Map(modules.facets.map(f=>[f.id,f]))};
}
function sanitizeState(raw,bank,modules){
 const indexes=indexBank(bank,modules); const st=createState();
 if(!safeObject(raw)||raw.schema!==SCHEMA)throw Error('Unsupported schema');
 for(const key of ['createdAt','updatedAt'])if(typeof raw[key]==='string'&&raw[key].length<100)st[key]=raw[key];
 if(safeObject(raw.answers))for(const [id,record] of Object.entries(raw.answers)){
  if(indexes.questions.has(id)&&safeObject(record)&&CHOICES.has(record.choice))st.answers[id]={choice:record.choice,at:typeof record.at==='string'?record.at:st.updatedAt};
 }
 if(safeObject(raw.importance))for(const [domain,n] of Object.entries(raw.importance))if(indexes.domainSet.has(domain)&&Number.isInteger(n)&&n>=0&&n<=5)st.importance[domain]=n;
 const maxIds=new Map(modules.maxdiff.map(c=>[c.id,c]));
 if(safeObject(raw.maxdiff))for(const [id,v] of Object.entries(raw.maxdiff)){const card=maxIds.get(id);if(card&&safeObject(v)&&card.facets.includes(v.best)&&card.facets.includes(v.worst)&&v.best!==v.worst)st.maxdiff[id]={best:v.best,worst:v.worst};}
 const situIds=new Set(modules.situations.map(x=>x.id));if(safeObject(raw.situations))for(const [id,c] of Object.entries(raw.situations))if(situIds.has(id)&&CHOICES.has(c))st.situations[id]=c;
 if(safeObject(raw.visuals))for(const [id,c] of Object.entries(raw.visuals))if(/^VP-(0[1-9]|1[0-5])$/.test(id)&&CHOICES.has(c))st.visuals[id]=c;
 const reflectIds=new Set(modules.reflections.map(x=>x.id));if(safeObject(raw.reflections))for(const [id,t] of Object.entries(raw.reflections))if(reflectIds.has(id)&&typeof t==='string')st.reflections[id]=t.slice(0,5000);
 if(Array.isArray(raw.dealbreakers))st.dealbreakers=raw.dealbreakers.filter(x=>typeof x==='string').slice(0,30).map(x=>x.slice(0,300));
 if(Array.isArray(raw.snapshots))st.snapshots=raw.snapshots.filter(s=>safeObject(s)&&safeObject(s.answers)&&typeof s.at==='string').slice(-15).map(s=>({at:s.at,answers:Object.fromEntries(Object.entries(s.answers).filter(([k,v])=>indexes.questions.has(k)&&CHOICES.has(v)))}));
 if(Array.isArray(raw.legacyImports))st.legacyImports=raw.legacyImports.filter(x=>safeObject(x)&&typeof x.importedAt==='string').slice(-5).map(x=>({importedAt:x.importedAt,source:x.source==='unknown-legacy'?'unknown-legacy':'unmapped',payload:x.payload,notice:'Not mapped onto v2 answers.'}));
 if(Array.isArray(raw.extensions))for(const item of raw.extensions.slice(0,30)){try{const module=validateExtension(item);if(!st.extensions.some(x=>x.id===module.id))st.extensions.push(module)}catch{ /* malformed imports are ignored */ }}
 if(safeObject(raw.extensionAnswers))for(const item of st.extensions){const entries=raw.extensionAnswers[item.id];if(!safeObject(entries))continue;st.extensionAnswers[item.id]={};for(const q of item.questions)if(q.options.some(o=>o.id===entries[q.id]))st.extensionAnswers[item.id][q.id]=entries[q.id];}
 return st;
}
function saveAnswer(st,id,choice,bank){if(!bank.questions.some(q=>q.id===id)||!CHOICES.has(choice))throw Error('Invalid question/choice');st.answers[id]={choice,at:new Date().toISOString()};touch(st);}
function touch(st){st.updatedAt=new Date().toISOString();}
function answered(choice){return ['A','B','BOTH','NEITHER'].includes(choice)}
function progress(st,bank,modules,visualPairs=[]) {
 const qa=bank.questions.filter(q=>own(st.answers,q.id)&&st.answers[q.id].choice!=='SKIP').length;
 return {questions:{done:qa,total:bank.questions.length},importance:{done:Object.keys(st.importance).length,total:bank.domains.length},maxdiff:{done:Object.keys(st.maxdiff).length,total:modules.maxdiff.length},situations:{done:Object.keys(st.situations).filter(id=>st.situations[id]!=='SKIP').length,total:modules.situations.length},visuals:{done:Object.keys(st.visuals).filter(id=>st.visuals[id]!=='SKIP').length,total:VISUAL_COUNT},reflections:{done:Object.keys(st.reflections).filter(id=>st.reflections[id].trim()).length,total:modules.reflections.length},photoPairsReady:visualPairs.filter(p=>p.ready).length};
}
function domainSummary(st,bank){return bank.domains.map(d=>{
 const qs=bank.questions.filter(q=>q.domain===d.code);
 const evidence=qs.filter(q=>answered(st.answers[q.id]?.choice)).map(q=>({id:q.id,choice:st.answers[q.id].choice,label:st.answers[q.id].choice==='A'?q.A:st.answers[q.id].choice==='B'?q.B:'Και οι δύο εκδοχές',A:q.A,B:q.B}));
 const skip=qs.filter(q=>st.answers[q.id]?.choice==='SKIP').length;
 return {domain:d.code,name:d.name,importance:st.importance[d.code]??null,evidence,covered:evidence.length,asked:qs.length,skip,uncertain:qs.filter(q=>st.answers[q.id]?.choice==='UNSURE').length};
});}
function maxdiffSummary(st,modules){return modules.facets.map(f=>{
 const exposures=modules.maxdiff.filter(c=>c.facets.includes(f.id)).length;
 const best=Object.values(st.maxdiff).filter(v=>v.best===f.id).length;
 const worst=Object.values(st.maxdiff).filter(v=>v.worst===f.id).length;
 const answeredCards=modules.maxdiff.filter(c=>c.facets.includes(f.id)&&st.maxdiff[c.id]).length;
 return {...f,exposures,answeredCards,best,worst,net:best-worst,rate:answeredCards?(best-worst)/answeredCards:null};
}).sort((a,b)=>(b.rate??-99)-(a.rate??-99));}
/** Transparent cross-module synthesis. Not a psychometric estimator. */
function crossModuleInsights(st,bank,modules){
 const ds=domainSummary(st,bank),mx=maxdiffSummary(st,modules);
 const byDomain=new Map(bank.domains.map(d=>[d.code,[]]));
 for(const f of mx){if(byDomain.has(f.domain)&&f.answeredCards>=3)byDomain.get(f.domain).push(f)}
 return ds.map(d=>{
  const forced=byDomain.get(d.domain)||[];
  const cards=modules.maxdiff.filter(c=>st.maxdiff[c.id]&&c.facets.some(id=>modules.facets.some(f=>f.id===id&&f.domain===d.domain))).map(c=>c.id);
  const relevantSituations=modules.situations.filter(q=>q.domain===d.domain&&answered(st.situations[q.id]));
  let signal='insufficient';
  if(d.importance!==null&&forced.length){
   const net=forced.reduce((total,f)=>total+f.net,0);
   signal=d.importance>=4&&net>0?'aligned-high':d.importance>=4&&net<0?'different-signals':d.importance<=2&&net>0?'different-signals':'mixed';
  }
  return {domain:d.domain,name:d.name,importance:d.importance,questionEvidence:d.evidence.map(e=>e.id),
   maxdiffEvidence:cards,facetEvidence:forced.map(f=>({id:f.id,label:f.label,net:f.net,seen:f.answeredCards})),
   scenarioEvidence:relevantSituations.map(q=>q.id),signal};
 }).filter(x=>x.signal!=='insufficient').sort((a,b)=>['different-signals','aligned-high','mixed'].indexOf(a.signal)-['different-signals','aligned-high','mixed'].indexOf(b.signal));
}
function situationalSummary(st,modules){return modules.situations.filter(q=>answered(st.situations[q.id])).map(q=>({id:q.id,domain:q.domain,title:q.title,choice:st.situations[q.id],selected:st.situations[q.id]==='A'?q.A:st.situations[q.id]==='B'?q.B:'Και οι δύο'}));}
function comparePartner(a,b,bank){const rows=[];for(const q of bank.questions){const x=a.answers[q.id]?.choice,y=b.answers[q.id]?.choice;if(!answered(x)||!answered(y))continue;const agree=x===y||(x==='BOTH'&&(y==='A'||y==='B'))||(y==='BOTH'&&(x==='A'||x==='B'));rows.push({id:q.id,domain:q.domain,a:x,b:y,agree});}return {shared:rows.length,agreements:rows.filter(x=>x.agree).length,differences:rows.filter(x=>!x.agree),note:'Descriptive concordance on exactly shared responses, not predictive relationship compatibility.'};}
function snapshot(st){st.snapshots.push({at:new Date().toISOString(),answers:Object.fromEntries(Object.entries(st.answers).map(([k,v])=>[k,v.choice]))});st.snapshots=st.snapshots.slice(-15);touch(st);}
function compareHistory(st,bank){if(!st.snapshots.length)return null;const previous=st.snapshots[st.snapshots.length-1];const common=[],changed=[];for(const q of bank.questions){const old=previous.answers[q.id],now=st.answers[q.id]?.choice;if(answered(old)&&answered(now)){common.push(q.id);if(old!==now)changed.push(q.id)}}return {at:previous.at,common:common.length,changed};}
function importSession(raw,bank,modules,previous=null){
 if(!safeObject(raw))throw Error('JSON object required');
 if(raw.schema===SCHEMA){return {state:sanitizeState(raw,bank,modules),type:'unified',notice:'Εισαγωγή ενιαίας συνεδρίας.'};}
 const v2raw=safeObject(raw.answers)?raw.answers:null;
 const keys=v2raw?Object.keys(v2raw):[];
 const known=new Set(bank.questions.map(q=>q.id));
 const matches=keys.filter(k=>known.has(k)).length;
 if(matches>0&&matches===keys.length){const st=previous?sanitizeState(previous,bank,modules):createState();
  for(const [id,v] of Object.entries(v2raw)){const c=typeof v==='string'?v:((v?.response)??(v?.choice));if(CHOICES.has(c)&&!own(st.answers,id))st.answers[id]={choice:c,at:typeof v?.answered_at==='string'?v.answered_at:new Date().toISOString()};}
  if(safeObject(raw.importance_by_domain))for(const [key,n] of Object.entries(raw.importance_by_domain))if(bank.domains.some(x=>x.code===key)&&Number.isInteger(n)&&n>=0&&n<=5&&!own(st.importance,key))st.importance[key]=n;
  touch(st);return {state:st,type:'v2',notice:'Αντιστοίχιση μέσω πραγματικών ID ερωτήσεων v2 (χωρίς επικάλυψη υπαρχουσών απαντήσεων).'};
 }
 const st=previous?sanitizeState(previous,bank,modules):createState();
 // retain unknown legacy evidence without interpreting / mapping it
 st.legacyImports.push({importedAt:new Date().toISOString(),source:'unknown-legacy',payload:JSON.parse(JSON.stringify(raw)),notice:'Not mapped onto v2 answers.'});st.legacyImports=st.legacyImports.slice(-5);touch(st);
 return {state:st,type:'legacy-unmapped',notice:'Το παλαιό αρχείο αποθηκεύτηκε αυτούσιο, αλλά ΔΕΝ αντιστοιχίστηκε σε ερωτήσεις v2.'};
}

/** Integration contract: questionnaire-only plugin, no executable code and no silent legacy crosswalk. */
function validateExtension(raw){
 if(!safeObject(raw)||raw.schema!=='mpw-module/v1'||typeof raw.id!=='string'||!/^ext-[a-z0-9-]{3,48}$/.test(raw.id))throw Error('Invalid module ID/schema');
 if(typeof raw.title!=='string'||raw.title.trim().length<3||raw.title.length>110)throw Error('Invalid module title');
 if(!Array.isArray(raw.questions)||raw.questions.length<1||raw.questions.length>200)throw Error('Invalid module questions count');
 const qIds=new Set();const questions=raw.questions.map(q=>{
  if(!safeObject(q)||typeof q.id!=='string'||!/^[-a-zA-Z0-9_]{1,50}$/.test(q.id)||qIds.has(q.id)||typeof q.prompt!=='string'||!q.prompt.trim()||q.prompt.length>500)throw Error('Invalid/duplicate module question');
  qIds.add(q.id);if(!Array.isArray(q.options)||q.options.length<2||q.options.length>6)throw Error('2..6 options required');
  const ids=new Set(),options=q.options.map(o=>{if(!safeObject(o)||typeof o.id!=='string'||!/^[-a-zA-Z0-9_]{1,30}$/.test(o.id)||ids.has(o.id)||typeof o.label!=='string'||!o.label.trim()||o.label.length>240)throw Error('Invalid option');ids.add(o.id);return {id:o.id,label:o.label}});
  return {id:q.id,prompt:q.prompt,options};
 });
 return {schema:'mpw-module/v1',id:raw.id,title:raw.title,description:typeof raw.description==='string'?raw.description.slice(0,400):'',questions};
}
function addExtension(st,raw){const def=validateExtension(raw);if(st.extensions.some(x=>x.id===def.id))throw Error('This module already exists');st.extensions.push(def);st.extensionAnswers[def.id]={};touch(st);return def;}
function recordExtensionChoice(st,moduleId,questionId,optionId){const mod=st.extensions.find(x=>x.id===moduleId),q=mod?.questions.find(q=>q.id===questionId);if(!q||!q.options.some(o=>o.id===optionId))throw Error('Unknown module question/option');st.extensionAnswers[moduleId]??={};st.extensionAnswers[moduleId][questionId]=optionId;touch(st);}
function extensionSummary(st){return st.extensions.map(m=>({id:m.id,title:m.title,done:m.questions.filter(q=>st.extensionAnswers[m.id]?.[q.id]).length,total:m.questions.length,items:m.questions.filter(q=>st.extensionAnswers[m.id]?.[q.id]).map(q=>({id:q.id,prompt:q.prompt,selected:q.options.find(x=>x.id===st.extensionAnswers[m.id][q.id]).label}))}));}

function photos(){photoCursor=clamp(photoCursor,0,14);const id='VP-'+String(photoCursor+1).padStart(2,'0'),ready=photoReady(id),existing=state.visuals[id];return sectionPath('Οπτικές προτιμήσεις')+`<div class="question-panel">${commonPanelHeading('Σταθερά ζευγάρια · 15 διαθέσιμες θέσεις',photoCursor+1,15)}<div class="question-kicker">Φωτογραφική σύγκριση ${id}</div><h1>Ποια εικόνα σε ελκύει περισσότερο;</h1><div class="info ${!ready?'warning':''}">${ready?'Το ζευγάρι έχει αποθηκευτεί στη συσκευή σου. Δεν θα αλλάξει μεταξύ συνεδριών, εκτός αν αντικαταστήσεις αρχείο.':'Δεν βρέθηκαν οι αρχικές εικόνες του προηγούμενου τεστ. Πρόσθεσε δύο δικές σου εικόνες ενηλίκων για να ενεργοποιηθεί αυτή η συγκεκριμένη σύγκριση. Δεν παράγονται τυχαίες εικόνες.'}</div><div class="photos">${['A','B'].map(side=>`<div class="photo-tile ${photoStore[id+'-'+side]?'':'placeholder'}">${photoStore[id+'-'+side]?`<img src="${esc(photoUrls[id+'-'+side]||'')}" alt="Πορτρέτο ${side}">`:`<span>Δεν έχει προστεθεί εικόνα ${side}</span>`}<label>Εικόνα ${side}<input type="file" data-upload="${id+'-'+side}" accept="image/png,image/jpeg,image/webp" class="file-input" aria-label="Προσθήκη εικόνας ${side}"></label></div>`).join('')}</div>${ready?`<div class="answers" style="margin-top:14px">${['A','B'].map(c=>`<button class="choice-btn ${existing===c?'selected':''}" data-action="visual" data-id="${id}" data-choice="${c}"><span class="choice-key">${c}</span> ${c==='A'?'Αριστερή εικόνα':'Δεξιά εικόνα'}</button>`).join('')}</div><div class="utility-options">${[['BOTH','Και οι δύο'],['NEITHER','Καμία'],['UNSURE','Δεν ξέρω'],['SKIP','Παράλειψη']].map(([c,t])=>`<button class="pill-btn ${existing===c?'selected':''}" data-action="visual" data-id="${id}" data-choice="${c}">${t}</button>`).join('')}</div>`:''}<div class="toolbar">${btn('← Προηγούμενη','photo-prev','soft',photoCursor===0?'disabled':'')}${btn('Επόμενη →','photo-next','secondary')}</div><p class="note">Επέλεξε μόνο εικόνες ενηλίκων που έχεις δικαίωμα να χρησιμοποιήσεις. Οπτικές προτιμήσεις ≠ συμπέρασμα για τον χαρακτήρα της εικονιζόμενης γυναίκας. Η αλλαγή φωτογραφίας ακυρώνει την παλιά επιλογή για το συγκεκριμένο ζευγάρι.</p></div>`}
function results(){const p=progress(state,BANK,MODULES);const domain=domainSummary(state,BANK).sort((a,b)=>(b.importance??-1)-(a.importance??-1)||b.covered-a.covered);
 const maxs=maxdiffSummary(state,MODULES).filter(x=>x.answeredCards>=2);const maxAnswered=Object.keys(state.maxdiff).length;const situ=situationalSummary(state,MODULES);const history=compareHistory(state,BANK);
 const trade=BANK.questions.filter(q=>q.kind==='tradeoff'&&answered(state.answers[q.id]?.choice)).map(q=>({q,choice:state.answers[q.id]?.choice}));
 const cross=crossModuleInsights(state,BANK,MODULES);
 const counts=domain.reduce((a,d)=>a+d.covered,0);
 return sectionPath('Ενιαίο προφίλ')+`<div class="hero" style="padding:12px 0 18px"><span class="eyebrow">YOUR PREFERENCE INTELLIGENCE</span><h1>Η εικόνα <em>μέχρι τώρα.</em></h1><p class="lead">Κάθε συμπέρασμα συνδέεται με συγκεκριμένες απαντήσεις. Δεν υπάρχει κατασκευασμένο «96% ιδανική γυναίκα», ούτε αυτοματοποιημένη διάγνωση ανθρώπων.</p><div class="actions">${btn('Συνέχεια στο τεστ','start','primary')}${btn('Λήψη αποτελεσμάτων','export','secondary')}${btn('Αποθήκευση στιγμιότυπου','snapshot','soft')}</div></div><div class="stats"><div class="stat"><strong>${p.questions.done}<span style="display:inline;font-size:17px"> / 135</span></strong><span>Ερωτήσεις</span></div><div class="stat"><strong>${maxAnswered}<span style="display:inline;font-size:17px"> / 20</span></strong><span>Trade-offs σημαντικότητας</span></div><div class="stat"><strong>${p.situations.done}<span style="display:inline;font-size:17px"> / 12</span></strong><span>Σενάρια</span></div><div class="stat"><strong>${p.visuals.done}<span style="display:inline;font-size:17px"> / 15</span></strong><span>Οπτικά ζεύγη</span></div></div><div class="result-card" style="margin-bottom:22px"><h3>Σύνθεση στοιχείων από διαφορετικά τεστ</h3><p class="note">Συνδυασμός ρητής σημαντικότητας και επαναλαμβανόμενων Best–Worst επιλογών. Δεν υπολογίζονται ψυχολογικά ποσοστά και δεν συγχέουμε τα διαφορετικά συμφραζόμενα με λογικές αντιφάσεις.</p>${cross.length?cross.slice(0,12).map(x=>`<details><summary>${esc(x.name)} · ${x.signal==='aligned-high'?'Συγκλίνουν οι επιλογές':x.signal==='different-signals'?'Αξίζει να το διερευνήσεις':'Μικτή εικόνα'}</summary><p class="note">Δηλωμένη σημαντικότητα: <strong>${x.importance}/5</strong>. ${x.facetEvidence.map(f=>`${esc(f.label)}: ${f.net>0?'+':''}${f.net} σε ${f.seen} εμφανίσεις`).join(' · ')}</p><p class="note">Τεκμήρια: ${x.maxdiffEvidence.map(esc).join(', ')}${x.scenarioEvidence.length?' · Σενάρια: '+x.scenarioEvidence.map(esc).join(', '):''}${x.questionEvidence.length?' · Ερωτήσεις: '+x.questionEvidence.slice(0,6).map(esc).join(', '):''}</p></details>`).join(''):'<p class="empty">Συμπλήρωσε την ανεξάρτητη σημαντικότητα και τουλάχιστον τρεις εμφανίσεις σχετικών χαρακτηριστικών στο Best–Worst για να εμφανιστεί τεκμηριωμένη σύνθεση.</p>'}</div><div class="result-layout"><div class="result-card"><h3>Προσωπική σειρά σημαντικότητας</h3>${domain.some(x=>x.importance!==null)?domain.filter(x=>x.importance!==null).map(d=>`<div class="data-row"><span>${esc(d.name)}</span><span class="rank">${d.importance}/5</span></div>`).join(''):'<div class="empty">Δεν έχεις ακόμη αξιολογήσει τις 12 κατηγορίες.</div>'}<p class="note">Μόνο οι ρητές αξιολογήσεις σου. Απαντήσεις Α/Β δεν χρησιμοποιούνται ως βαθμοί σημαντικότητας.</p></div><div class="result-card"><h3>Best–Worst: τι υπερίσχυσε στις επιλογές</h3>${maxs.length?maxs.slice(0,10).map(d=>`<div class="data-row"><span>${esc(d.label)} <small>(${d.answeredCards}/5 εμφανίσεις)</small></span><span><strong>${d.net>0?'+':''}${d.net}</strong></span></div>`).join(''):'<div class="empty">Χρειάζονται απαντήσεις στο Best–Worst τεστ.</div>'}<p class="note">Διαφορά «πιο» μείον «λιγότερο», όχι ψυχομετρικό σκορ. Θετικές και αρνητικές τιμές είναι σχετικές μόνο σε αυτές τις κάρτες.</p></div></div><div class="section-heading"><h2>12 τομείς · συγκεκριμένα στοιχεία</h2></div><div class="result-layout">${domain.map(d=>`<div class="result-card"><h3>${esc(d.name)} ${d.importance===null?'':`<span class="tag">${d.importance}/5 σημαντικότητα</span>`}</h3><p class="note">${d.covered} σαφείς επιλογές από ${d.asked} ερωτήσεις · ${d.uncertain} αβέβαιες · ${d.skip} παραλείψεις ${d.covered<3?'<span class="tag">Προσωρινή εικόνα</span>':''}</p>${d.evidence.length?`<details><summary>Δες τις ${d.evidence.length} τεκμηριωμένες προτιμήσεις</summary><ol>${d.evidence.map(e=>`<li><strong>${e.id}</strong> — ${esc(e.label)}</li>`).join('')}</ol></details>`:'<p class="muted small">Δεν έχουν δοθεί αρκετές απαντήσεις σε αυτόν τον τομέα.</p>'}</div>`).join('')}</div><div class="result-layout"><div class="result-card"><h3>Συγκεκριμένα διλήμματα</h3>${trade.length?trade.slice(0,18).map(({q,choice})=>`<div class="data-row"><span><small>${q.id}</small> ${esc(choice==='A'?q.A:choice==='B'?q.B:'Και τα δύο')}</span></div>`).join(''):'<p class="note">Δεν έχουν ολοκληρωθεί διλήμματα.</p>'}</div><div class="result-card"><h3>Απαντήσεις σε σενάρια</h3>${situ.length?situ.map(s=>`<div class="data-row"><span><small>${esc(s.title)}</small> · ${esc(s.selected)}</span></div>`).join(''):'<p class="note">Δεν υπάρχουν ακόμη απαντήσεις σε σενάρια.</p>'}</div></div>${history?`<div class="info">Σύγκριση με προηγούμενο στιγμιότυπο (${esc(history.at)}): ${history.common} κοινές ερωτήσεις, ${history.changed.length} αλλαγές${history.changed.length?': '+history.changed.map(esc).join(', '):''}. Δεν υπολογίζονται νέες/παραλειφθείσες ερωτήσεις.</div>`:''}<div class="result-card" style="margin-bottom:24px"><h3>Τι παραμένει άγνωστο</h3><p class="note">Έχουν καταγραφεί ${counts} συγκεκριμένες επιλογές στις 12 κατηγορίες. Οι κατηγορίες με λίγα στοιχεία, οι αβέβαιες απαντήσεις και οι φωτογραφίες χωρίς σταθερό ζευγάρι χρειάζονται περισσότερα δεδομένα, όχι αυθαίρετα συμπεράσματα. Η έλξη προς υπαρκτό άτομο και η αμοιβαία σχέση δεν αποδεικνύονται από υποθετικά τεστ.</p>${state.legacyImports.length?`<p class="note">Υπάρχουν ${state.legacyImports.length} παλαιές εισαγωγές σε καραντίνα: δεν επηρεάζουν τη βαθμολόγηση.</p>`:''}</div>`}
function settings(){return sectionPath('Δεδομένα και ρυθμίσεις')+`<div class="hero" style="padding:15px 0"><span class="eyebrow">LOCAL DATA & PORTABILITY</span><h1>Έλεγχος των <em>δεδομένων σου.</em></h1><p class="lead">Οι απαντήσεις δεν αποστέλλονται σε server. Η εξαγωγή JSON μεταφέρει το ενιαίο προφίλ και μπορεί να διαβαστεί από μελλοντικές εκδόσεις.</p></div><div class="settings-list"><div class="surface"><h2 class="page-title">Εξαγωγή</h2><p class="note">Κατέβασε όλες τις απαντήσεις, σημειώσεις, προτεραιότητες και ιστορικά snapshots.</p><div class="actions">${btn('Εξαγωγή JSON','export','primary')}${btn('Εξαγωγή + φωτογραφίες','export-images','secondary')}</div></div><div class="surface"><h2 class="page-title">Εισαγωγή από άλλα τεστ</h2><p class="note">Αποδεκτά: ενιαίο αρχείο Super Test ή v2 ερωτηματολόγιο με τα πραγματικά IDs, όπως G-EMO και D-VIS-01. Άγνωστες/αριθμητικές απαντήσεις παλιών εκδόσεων διατηρούνται αυτούσιες χωρίς ψευδή αντιστοίχιση.</p><input id="import-file" type="file" accept="application/json,.json" class="file-input" aria-label="Εισαγωγή JSON"><p class="note">Η εισαγωγή συμβατής πλήρους συνεδρίας αντικαθιστά το τρέχον προφίλ. Κάνε εξαγωγή πριν από εισαγωγή.</p></div><div class="surface"><h2 class="page-title">Ιστορικό και σύντροφος</h2><p class="note">Κράτα στιγμιότυπο για να συγκρίνεις τις ίδιες ερωτήσεις αργότερα. Μπορείς επίσης να συγκρίνεις αρχείο που συμπλήρωσε ανεξάρτητα άλλο ενήλικο άτομο και μοιράστηκε οικειοθελώς.</p><div class="actions">${btn('Αποθήκευση στιγμιότυπου','snapshot','secondary')}<label class="secondary" style="cursor:pointer">Σύγκριση δύο προφίλ<input type="file" id="partner-file" accept="application/json,.json" hidden></label></div>${compared?`<div class="info"><strong>Κοινές έγκυρες ερωτήσεις: ${compared.shared}.</strong> Σημεία σύγκλισης ${compared.agreements}. Διαφορετικές απαντήσεις: ${compared.differences.length}. Δεν πρόκειται για βαθμό συμβατότητας.</div>`:''}</div><div class="surface"><h2 class="page-title">Διαγραφή</h2><p class="note">Διέγραψε τοπικά τις απαντήσεις και το φωτογραφικό σετ από αυτήν τη συσκευή. Η ενέργεια δεν αναιρείται χωρίς δικό σου αντίγραφο JSON.</p>${btn('Διαγραφή όλων των τοπικών δεδομένων','clear-data','soft')}</div></div>`}
const actionHandlers={
 home(){goto('home')},settings(){goto('settings')},results(){goto('results')},start(){guidedStart()},module(e){selectModule(e.dataset.module)},
 answer(e){const id=e.dataset.id,choice=e.dataset.choice;saveAnswer(state,id,choice,BANK);if(id==='G-VIS')state.visuals['VP-01']=choice;persist();const qs=availableQuestions();if(questionCursor<qs.length-1){questionCursor++;render()}else{toast('Ολοκληρώθηκαν οι ερωτήσεις. Συνεχίζουμε στις προτεραιότητες.');selectModule('importance')}},
 'q-prev'(){questionCursor--;render()},'q-next'(){questionCursor++;if(questionCursor>=availableQuestions().length){selectModule('importance');return}render()},
 rate(e){state.importance[e.dataset.domain]=Number(e.dataset.n);persist();if(importanceCursor<11){importanceCursor++;render()}else{toast('Οι προτεραιότητες καταγράφηκαν. Συνεχίζουμε στα διλήμματα.');selectModule('maxdiff')}},
 'importance-prev'(){importanceCursor--;render()},'importance-next'(){if(importanceCursor<11){importanceCursor++;render()}else selectModule('maxdiff')},
 best(e){pendingBest=e.dataset.facet;if(pendingWorst===pendingBest)pendingWorst=null;render()},worst(e){pendingWorst=e.dataset.facet;if(pendingBest===pendingWorst)pendingBest=null;render()},
 'max-save'(){const id=MODULES.maxdiff[maxCursor].id,card=MODULES.maxdiff[maxCursor];const best=pendingBest??state.maxdiff[id]?.best,worst=pendingWorst??state.maxdiff[id]?.worst;if(!card.facets.includes(best)||!card.facets.includes(worst)||best===worst){toast('Επίλεξε έναν διαφορετικό πιο και λιγότερο σημαντικό παράγοντα.');return}state.maxdiff[id]={best,worst};persist();pendingBest=null;pendingWorst=null;if(maxCursor<19)maxCursor++;else {goto('situations');return}render()},
 'max-prev'(){maxCursor--;pendingBest=null;pendingWorst=null;render()},
 scenario(e){state.situations[e.dataset.id]=e.dataset.choice;persist();if(situationCursor<11)situationCursor++;else {toast('Τα σενάρια ολοκληρώθηκαν. Οι βαθιές συζητήσεις είναι προαιρετικές.');goto('results');return}render()},'scenario-prev'(){situationCursor--;render()},'scenario-next'(){if(situationCursor<11)situationCursor++;else goto('results');render()},
 'reflection-save'(){const id=MODULES.reflections[reflectionCursor].id;state.reflections[id]=$('reflection-text').value.slice(0,5000);persist();if(reflectionCursor<49)reflectionCursor++;else goto('results');render()},'reflection-prev'(){reflectionCursor--;render()},
 visual(e){const id=e.dataset.id;if(!photoReady(id))return;state.visuals[id]=e.dataset.choice;if(id==='VP-01')saveAnswer(state,'G-VIS',e.dataset.choice,BANK);persist();if(photoCursor<14)photoCursor++;else goto('results');render()},
 'photo-prev'(){photoCursor--;render()},'photo-next'(){if(photoCursor<14)photoCursor++;else goto('results');render()},
 export(){downloadData('my-perfect-woman-supertest.json',exportJSON(state))},
 'export-images'(){exportWithImages()},
 snapshot(){snapshot(state);persist();toast('Το στιγμιότυπο αποθηκεύτηκε');render()},
 'clear-data'(){if(confirm('Να διαγραφούν οριστικά οι τοπικές απαντήσεις και όλες οι εικόνες;')){try{localStorage.removeItem(STORAGE_KEY)}catch{}state=createState();clearPhotos().catch(err=>console.warn('Photo deletion unavailable',err)).finally(()=>{compared=null;toast('Τα διαθέσιμα τοπικά δεδομένα διαγράφηκαν.');goto('home')})}}
};
document.addEventListener('click',ev=>{const el=ev.target.closest('button[data-action]');if(!el||el.disabled)return;const fn=actionHandlers[el.dataset.action];if(fn)try{fn(el)}catch(err){console.error(err);toast('Κάτι δεν πήγε καλά: '+err.message)}});
document.addEventListener('change',async ev=>{const el=ev.target;if(el.matches('[data-upload]')){if(!el.files?.length)return;const f=el.files[0];if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>15_000_000){toast('Διάλεξε JPEG/PNG/WebP μέχρι 15 MB.');return}const id=el.dataset.upload;try{await putPhoto(id,f);const pair=id.slice(0,5);delete state.visuals[pair];if(pair==='VP-01')delete state.answers['G-VIS'];persist();await refreshPhotos();toast('Η φωτογραφία αποθηκεύτηκε μόνιμα στη συσκευή.');render()}catch(err){console.error(err);toast('Δεν μπόρεσα να αποθηκεύσω τη φωτογραφία.');}return}
 if(el.id==='import-file'||el.id==='partner-file'){
  if(!el.files?.length)return;try{if(el.files[0].size>35_000_000)throw Error('Το αρχείο υπερβαίνει τα 35 MB.');const raw=JSON.parse(await el.files[0].text());if(el.id==='partner-file'){const b=sanitizeState(raw.session?.schema===SCHEMA?raw.session:raw,BANK,MODULES);compared=comparePartner(state,b,BANK);toast('Η σύγκριση υπολογίστηκε μόνο σε κοινές απαντήσεις.');render();return}
   const actual=raw?.session?.schema===SCHEMA?raw.session:raw;
   const res=importSession(actual,BANK,MODULES,state);if(res.type==='unified'&&!confirm('Αντικατάσταση της τρέχουσας συνεδρίας από το αρχείο;'))return;
   state=res.state;persist();if(raw.images&&typeof raw.images==='object')await importImages(raw.images);await refreshPhotos();toast(res.notice);goto('home')
  }catch(err){console.error(err);toast('Το JSON δεν ήταν έγκυρο ή δεν αναγνωρίζεται: '+err.message)}return}
 });
function downloadData(name,data){const blob=new Blob([data],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Το αρχείο JSON ετοιμάστηκε.');}
function fileToDataURL(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
async function exportWithImages(){const images={};for(const [key,blob] of Object.entries(photoStore))images[key]=await fileToDataURL(blob);downloadData('my-perfect-woman-with-photos.json',JSON.stringify({session:state,images},null,2));}
async function importImages(images){for(const [key,val] of Object.entries(images)){if(!/^VP-(0[1-9]|1[0-5])-[AB]$/.test(key)||typeof val!=='string'||!/^data:image\/(png|jpeg|webp);base64,/.test(val)||val.length>22_000_000)continue;const blob=await (await fetch(val)).blob();await putPhoto(key,blob)}}
async function initDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window)){reject(new Error('IndexedDB unavailable'));return}const req=indexedDB.open('mpw-photo-pack-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function getPhotos(){return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readonly'),store=tx.objectStore('photos'),keysRequest=store.getAllKeys(),valuesRequest=store.getAll();tx.oncomplete=()=>resolve(Object.fromEntries(keysRequest.result.map((k,i)=>[k,valuesRequest.result[i]])));tx.onerror=()=>reject(tx.error);})}
function putPhoto(id,blob){if(!db)throw Error('No persistent database');return new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function refreshPhotos(){Object.values(photoUrls).forEach(url=>URL.revokeObjectURL(url));photoUrls={};photoStore=db?await getPhotos():{};for(const [key,val] of Object.entries(photoStore))if(val instanceof Blob)photoUrls[key]=URL.createObjectURL(val)}
async function clearPhotos(){if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});await refreshPhotos()}
async function bootstrap(){indexBank(BANK,MODULES);try{const old=localStorage.getItem(STORAGE_KEY);if(old)state=sanitizeState(JSON.parse(old),BANK,MODULES)}catch(err){ephemeral=true;console.warn('No stored data',err)}try{db=await initDB();await refreshPhotos()}catch(err){ephemeral=true;console.warn('Photos cannot persist',err)}render();if(ephemeral)toast('Περιορισμένη αποθήκευση στη συσκευή. Κράτησε αντίγραφο JSON.')}
bootstrap();
</script></body></html>
