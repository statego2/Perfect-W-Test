name: Super Test verification
on:
  push:
    paths:
      - "modules/supertest/**"
      - ".github/workflows/supertest.yml"
  pull_request:
    paths:
      - "modules/supertest/**"
      - ".github/workflows/supertest.yml"
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/supertest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify integrated offline HTML
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const s=fs.readFileSync("index.html","utf8");
            assert(s.includes("Beauty Intelligence"),"Missing Beauty section");
            assert(s.includes("BPL-1.0.0"),"Missing BPL version");
            assert(s.includes("const BPL_ASSET_IMAGES"),"Missing static image bundle");
            assert(s.includes("data:image/webp;base64,"),"No bundled WebP portraits");
            assert(s.includes("function skipBeauty()"),"Missing skip behavior");
          '
