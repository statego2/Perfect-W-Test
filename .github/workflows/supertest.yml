name: Super Test verification
on:
  push:
    paths:
      - "modules/supertest/**"
      - ".github/workflows/supertest.yml"
  pull_request:
    paths:
      - "modules/supertest/**"
      - ".github/workflows/supertest.yml"
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/supertest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Ensure generated entry is committed
        run: git diff --exit-code -- index.html
